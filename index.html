
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA - Robot Mission Control</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <!-- LEFT: LOGO AND BRAND -->
        <div class="brand-section">

            <div class="logo-box">
                <span>N</span>
            </div>

            <div class="brand-text">
                <h1>NETRA</h1>
                <p>ROBOT MISSION CONTROL</p>
            </div>

        </div>


        <!-- CENTER: NAVIGATION -->
        <nav class="nav-section">
            <a href="#">Dashboard</a>
            <a href="#">Fleet</a>
            <a href="#">Telemetry</a>
            <a href="#">Alerts</a>
        </nav>


        <!-- RIGHT: SYSTEM STATUS -->
        <div class="status-section">

            <span class="online-dot"></span>

            <span class="online-text">
                SYSTEM ONLINE
            </span>

            <span class="clock" id="clock">
                6:41:32 am
            </span>

        </div>


        <!-- DISPATCH BUTTON -->
        <div class="button-section">
            <button class="dispatch-button">
                +Dispatch Mission
            </button>
        </div>

    </header>

    <script>
        function updateClock() {
            const now = new Date();

            document.getElementById("clock").textContent =
                now.toLocaleTimeString("en-US", {
                    hour: "numeric",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                });
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
